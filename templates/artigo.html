<!DOCTYPE html>
<html lang="pt-br">
<head>
	<title>{{titulo}} | Paróquia NSR Jericó/PB</title>
	<meta name="description" content="{{resumo}}">
	<meta name="keywords" content="artigo, {{categoria}}, paróquia, Jericó, {{titulo}}">
	<link rel="canonical" href="https://pascomjerico.com.br/artigos/{{slug}}.html">
	<meta property="og:type" content="article">
	<meta property="og:site_name" content="Paróquia Nossa Senhora dos Remédios — Jericó/PB">
	<meta property="og:locale" content="pt_BR">
	<meta property="og:title" content="{{titulo}}">
	<meta property="og:description" content="{{resumo}}">
	<meta property="og:url" content="https://pascomjerico.com.br/artigos/{{slug}}.html">
	<meta property="og:image" content="https://pascomjerico.com.br{{imagem_capa.url}}">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="{{titulo}}">
	<meta name="twitter:description" content="{{resumo}}">
	<meta name="twitter:image" content="https://pascomjerico.com.br{{imagem_capa.url}}">
	<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{titulo}}",
  "datePublished": "{{data_publicacao}}",
  "dateModified": "{{data_atualizacao_or_publicacao}}",
  "author": {
    "@type": "Person",
    "name": "{{autor.nome}}"
  },
  "publisher": {
    "@type": "Organization",
    "name": "Paróquia Nossa Senhora dos Remédios — Jericó/PB",
    "logo": {
      "@type": "ImageObject",
      "url": "https://pascomjerico.com.br/images/logo.png"
    }
  },
  "image": "https://pascomjerico.com.br{{imagem_capa.url}}",
  "description": "{{resumo}}",
  "mainEntityOfPage": "https://pascomjerico.com.br/artigos/{{slug}}.html"
}
	</script>
	<!-- @include partials/head-css.html -->
</head>

<body class="artigo-detalhe-page" data-page="historia">

<a class="visually-hidden-focusable" href="#main-content">Pular para o conteúdo principal</a>

<!-- @include partials/header.html -->

<main id="main-content">

	<div class="page-header">
		<div class="container">
			<div class="row align-items-center">
				<div class="col-lg-12">
					<div class="page-header-box">
						<h1 class="text-anime-style-2" data-cursor="-opaque">{{titulo}}</h1>
						<nav class="wow fadeInUp" aria-label="breadcrumb">
							<ol class="breadcrumb">
								<li class="breadcrumb-item"><a href="../index.html">início</a></li>
								<li class="breadcrumb-item"><a href="../artigos.html">artigos</a></li>
								<li class="breadcrumb-item active" aria-current="page">{{titulo}}</li>
							</ol>
						</nav>
					</div>
				</div>
			</div>
		</div>
	</div>

	<section class="blog-single py-5">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-lg-9">
					<article class="post">
						<header class="post-header mb-4">
							<div class="post-meta small text-muted">
								<span><i class="fa-solid fa-calendar-days me-1" aria-hidden="true"></i> {{data_publicacao_formatada}}</span>
								<span class="ms-3"><i class="fa-solid fa-user me-1" aria-hidden="true"></i> {{autor.nome}}</span>
								<span class="ms-3"><i class="fa-solid fa-folder me-1" aria-hidden="true"></i> {{categoria}}</span>
							</div>
						</header>

						<figure class="post-thumbnail mb-4">
							<img src="..{{imagem_capa.url}}" alt="{{imagem_capa.alt}}" class="img-fluid rounded" loading="eager">
						</figure>

						<div class="post-content">
							{{conteudo}}
						</div>

						{{#tags_list}}
						<footer class="post-footer mt-4 pt-4 border-top">
							<div class="post-tags small">
								<strong>Tags:</strong>
								{{#items}}<span class="badge bg-secondary me-1">{{.}}</span>{{/items}}
							</div>
						</footer>
						{{/tags_list}}
					</article>
				</div>
			</div>
		</div>
	</section>

</main>

<!-- @include partials/footer.html -->

<!-- @include partials/scripts-common.html -->

</body>
</html>
