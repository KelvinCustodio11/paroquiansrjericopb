# Apache VirtualHost — CMS Admin (Laravel / Filament)
# Replica a configuração do Plesk para admin.pascomjerico.com.br
# Acesso local: http://localhost:8081
#
# IMPORTANTE: a DocumentRoot aponta para cms/public/, NÃO para cms/
# Isso replica a configuração de segurança do Plesk que coloca o Laravel
# com seu /public como raiz — .env, database.sqlite etc. ficam inacessíveis.

Listen 81

<VirtualHost *:81>
    ServerName admin.paroquia.local

    DocumentRoot /var/www/vhosts/paroquia.local/cms/public

    <Directory /var/www/vhosts/paroquia.local/cms/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Bloquear acesso a tudo fora de /public (segurança Laravel no Plesk)
    <Directory /var/www/vhosts/paroquia.local/cms>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /var/www/vhosts/paroquia.local/cms/public>
        Require all granted
    </Directory>

    # Logs separados por vhost
    ErrorLog  /var/log/apache2/cms-error.log
    CustomLog /var/log/apache2/cms-access.log combined
</VirtualHost>
