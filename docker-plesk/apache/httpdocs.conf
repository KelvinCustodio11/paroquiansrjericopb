# Apache VirtualHost — Site estático (httpdocs)
# Replica a configuração do Plesk para o domínio principal pascomjerico.com.br
# Acesso local: http://localhost:8080

<VirtualHost *:80>
    ServerName paroquia.local
    ServerAlias www.paroquia.local

    DocumentRoot /var/www/vhosts/paroquia.local/httpdocs

    <Directory /var/www/vhosts/paroquia.local/httpdocs>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Logs separados por vhost (igual ao Plesk)
    ErrorLog  /var/log/apache2/httpdocs-error.log
    CustomLog /var/log/apache2/httpdocs-access.log combined

    # Bloquear acesso direto à pasta cms/ se ela existir dentro de httpdocs
    # (No Plesk real ela fica FORA de httpdocs — isso é só segurança extra)
    <DirectoryMatch "^/var/www/vhosts/paroquia.local/httpdocs/(cms|_template-|\.git|node_modules)">
        Require all denied
    </DirectoryMatch>
</VirtualHost>
