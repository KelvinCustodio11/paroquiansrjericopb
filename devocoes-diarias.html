<script>
(function () {
  'use strict';

  /* ── Carrega configurações para saber quais abas habilitar ─────────── */
  var config = {};
  fetch('data/configuracoes.json?' + Date.now())
    .then(function (r) { return r.ok ? r.json() : {}; })
    .catch(function () { return {}; })
    .then(function (cfg) {
      config = cfg;
      if (cfg.habilitar_santo_dia === false) {
        document.getElementById('tab-santo-item').style.display = 'none';
      }
      if (cfg.habilitar_evangelho_dia === false) {
        document.getElementById('tab-evangelho-item').style.display = 'none';
      }
      if (cfg.habilitar_terco_dia === false) {
        document.getElementById('tab-terco-item').style.display = 'none';
      }
      /* Ativa a primeira aba visível */
      var primeiraAba = document.querySelector('#devocoesTabs .nav-item:not([style*="none"]) .nav-link');
      if (primeiraAba) { primeiraAba.click(); }
    });

  /* ── Santo do Dia (via Wikipedia PT-BR) ────────────────────────────── */
  function carregarSanto() {
    var hoje = new Date();
    var dia   = hoje.getDate();
    var mes   = hoje.toLocaleDateString('pt-BR', { month: 'long' });
    var url   = 'https://pt.wikipedia.org/api/rest_v1/page/summary/' +
                encodeURIComponent(dia + '_de_' + mes);

    fetch(url)
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (data) {
        var el = document.getElementById('santo-container');
        if (!data || !data.extract) {
          el.innerHTML = '<div class="text-center py-4 text-muted">'
            + '<p>Informações do santo do dia não disponíveis no momento. Consulte o <a href="https://pt.wikipedia.org/wiki/' + dia + '_de_' + mes + '" target="_blank" rel="noopener noreferrer">Calendário Litúrgico</a>.</p>'
            + '</div>';
          return;
        }
        var img = data.thumbnail ? '<img src="' + data.thumbnail.source + '" alt="' + (data.title || '') + '" class="float-end ms-3 mb-2 rounded" style="max-width:180px;max-height:220px;object-fit:cover" loading="lazy">' : '';
        el.innerHTML = '<div class="row justify-content-center">'
          + '<div class="col-lg-8">'
          + '<h2 class="fw-bold mb-3" style="color:var(--primary-color)">' + (data.title || 'Santo do Dia') + '</h2>'
          + img
          + '<p class="lead">' + (data.extract || '') + '</p>'
          + '<a href="' + (data.content_urls && data.content_urls.desktop ? data.content_urls.desktop.page : '#') + '" target="_blank" rel="noopener noreferrer" class="btn-default mt-3 d-inline-block"><span>Ver mais na Wikipedia</span></a>'
          + '</div>'
          + '</div>';
      });
  }

  /* ── Evangelho do Dia (via Evangelizo / Liturgia API) ───────────────── */
  function carregarEvangelho() {
    var hoje  = new Date();
    var data  = hoje.getFullYear()
              + '-' + String(hoje.getMonth() + 1).padStart(2, '0')
              + '-' + String(hoje.getDate()).padStart(2, '0');
    var url = 'https://liturgia.up.railway.app/';

    fetch(url)
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (d) {
        var el = document.getElementById('evangelho-container');
        if (!d || !d.evangelho) {
          el.innerHTML = '<div class="text-center py-4 text-muted">'
            + '<p>Evangelho do dia não disponível no momento.</p>'
            + '<a href="agenda-liturgica.html?tab=liturgia" class="btn-default"><span>Ver na Agenda Litúrgica</span></a>'
            + '</div>';
          return;
        }
        var ev = d.evangelho;
        el.innerHTML = '<div class="row justify-content-center">'
          + '<div class="col-lg-8">'
          + '<p class="text-uppercase small fw-bold mb-1" style="color:var(--primary-color)">'
            + (d.liturgia || '') + ' · ' + (d.data || '') + '</p>'
          + '<h2 class="fw-bold mb-2">' + (ev.titulo || 'Evangelho do Dia') + '</h2>'
          + '<p class="text-muted mb-3"><em>' + (ev.referencia || '') + '</em></p>'
          + '<div class="liturgia-texto lh-lg">' + (ev.texto || '').replace(/\n/g, '<br>') + '</div>'
          + '<hr class="my-4">'
          + '<p class="text-muted small text-end">Fonte: CNBB / liturgia.up.railway.app</p>'
          + '</div>'
          + '</div>';
      });
  }

  /* ── Terço do Dia ───────────────────────────────────────────────────── */
  function carregarTerco() {
    /* Inline (sem import dinâmico para compatibilidade ampla) */
    var MISTERIOS = {
      gozosos:    { nome: 'Mistérios Gozosos',   subtitulo: 'Segunda-feira e Sábado', icone: 'fa-star',
        lista: ['A Anunciação do Anjo Gabriel a Maria Santíssima','A Visitação de Nossa Senhora a Santa Isabel','O Nascimento de Jesus em Belém','A Apresentação de Jesus no Templo','Jesus encontrado entre os Doutores no Templo'] },
      luminosos:  { nome: 'Mistérios Luminosos',  subtitulo: 'Quinta-feira', icone: 'fa-sun',
        lista: ['O Batismo de Jesus no Rio Jordão','A Auto-revelação de Jesus nas Bodas de Caná','O Anúncio do Reino de Deus com apelo à conversão','A Transfiguração de Jesus no Monte Tabor','A Instituição da Eucaristia na Última Ceia'] },
      sorridentes:{ nome: 'Mistérios Dolorosos',  subtitulo: 'Terça-feira e Sexta-feira', icone: 'fa-cross',
        lista: ['A Agonia de Jesus no Jardim do Getsêmani','A Flagelação de Jesus na coluna','A Coroação de espinhos','Jesus carregando a Cruz até o Calvário','A Crucificação e Morte de Nosso Senhor Jesus Cristo'] },
      gloriosos:  { nome: 'Mistérios Gloriosos',  subtitulo: 'Quarta-feira, Domingo e Sábado (alt.)', icone: 'fa-crown',
        lista: ['A Ressurreição de Jesus Cristo','A Ascensão de Jesus ao Céu','A Vinda do Espírito Santo no Pentecostes','A Assunção de Nossa Senhora ao Céu','A Coroação de Nossa Senhora como Rainha do Universo'] },
    };
    var mapa = { 0:'gloriosos', 1:'gozosos', 2:'sorridentes', 3:'gloriosos', 4:'luminosos', 5:'sorridentes', 6:'gozosos' };
    var chave = mapa[new Date().getDay()];
    var m = MISTERIOS[chave];

    var misteriosHTML = m.lista.map(function (txt, i) {
      return '<div class="mb-4 p-3 rounded-3 bg-light">'
        + '<h6 class="fw-bold mb-1" style="color:var(--primary-color)">' + (i + 1) + 'º Mistério</h6>'
        + '<p class="mb-0 fst-italic">' + txt + '</p>'
        + '<small class="text-muted">Pai-Nosso · 10 Ave-Marias · Glória ao Pai</small>'
        + '</div>';
    }).join('');

    var el = document.getElementById('terco-container');
    el.innerHTML = '<div class="row justify-content-center">'
      + '<div class="col-lg-7">'
      + '<div class="text-center mb-4">'
      + '<i class="fas ' + m.icone + ' fa-3x mb-3" style="color:var(--primary-color)" aria-hidden="true"></i>'
      + '<h2 class="fw-bold">' + m.nome + '</h2>'
      + '<p class="text-muted">' + m.subtitulo + '</p>'
      + '</div>'
      + '<div class="alert border-0 mb-4" style="background:rgba(var(--primary-rgb,172,170,89),.08)">'
      + '<strong>Como iniciar:</strong> Sinal da Cruz · Credo Apostólico · Pai-Nosso · 3 Ave-Marias · Glória ao Pai'
      + '</div>'
      + '<h5 class="fw-bold mb-3">Os 5 Mistérios de Hoje</h5>'
      + misteriosHTML
      + '<div class="p-4 rounded-3 bg-light mt-4">'
      + '<h6 class="fw-bold">Encerramento — Salve Rainha</h6>'
      + '<p class="small mb-0 fst-italic">Salve Rainha, Mãe de misericórdia, vida, doçura, esperança nossa, salve! A Vós bradamos, os degredados filhos de Eva; a Vós suspiramos, gemendo e chorando neste vale de lágrimas. Eia pois, Advogada nossa, esses Vossos olhos misericordiosos a nós voltai; e depois deste desterro, mostrai-nos Jesus, o fruto bendito do Vosso ventre. Ó clemente, ó piedosa, ó doce sempre Virgem Maria!</p>'
      + '</div>'
      + '</div>'
      + '</div>';
  }

  /* ── Lazy load das abas ─────────────────────────────────────────────── */
  var carregado = { santo: false, evangelho: false, terco: false };

  document.addEventListener('shown.bs.tab', function (e) {
    var target = e.target.getAttribute('data-bs-target');
    if (target === '#painel-santo' && !carregado.santo) {
      carregado.santo = true; carregarSanto();
    } else if (target === '#painel-evangelho' && !carregado.evangelho) {
      carregado.evangelho = true; carregarEvangelho();
    } else if (target === '#painel-terco' && !carregado.terco) {
      carregado.terco = true; carregarTerco();
    }
  });

  /* Carrega a aba ativa inicial */
  var abaAtiva = document.querySelector('#devocoesTabs .nav-link.active');
  if (abaAtiva) {
    var targetId = abaAtiva.getAttribute('data-bs-target');
    if (targetId === '#painel-santo')      { carregado.santo = true;      carregarSanto(); }
    else if (targetId === '#painel-evangelho') { carregado.evangelho = true; carregarEvangelho(); }
    else if (targetId === '#painel-terco') { carregado.terco = true;      carregarTerco(); }
  }
})();
</script>
